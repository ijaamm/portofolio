<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>
    <title>Portofolio</title>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar" aria-label="Navigasi utama">
        <a class="navbar__brand" href="#beranda">Portofolio</a>

        <input
          type="checkbox"
          id="nav-toggle"
          class="navbar__toggle"
          aria-label="Buka menu"
        />
        <label for="nav-toggle" class="navbar__toggle-label" aria-hidden="true">
          <span></span>
          <span></span>
        </label>

        <ul class="navbar__links">
          <li><a href="#beranda">Beranda</a></li>
          <li><a href="#tentang">Tentang</a></li>
          <li class="navbar__actions">
            <details class="contact-dropdown">
              <summary>Kontak</summary>
              <ul>
                <li><a href="mailto:ijammusyaf@gmail.com">Email</a></li>
                <li>
                  <a
                    href="https://wa.me/6281291605094"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    WhatsApp
                  </a>
                </li>
              </ul>
            </details>
            <a class="download-button" href="assets/cv.pdf" download
              >Download CV</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="hero" id="beranda">
        <canvas class="hero__particles" aria-hidden="true"></canvas>
        <div class="hero__content">
          <div class="hero__copy">
            <p class="hero__eyebrow">Halo, saya</p>
            <h1 aria-label="Ilzam Roin Musyafa">
              <span class="typing-line" data-text="Ilzam Roin"></span>
              <span class="typing-line" data-text="Musyafa"></span>
            </h1>
            <p class="hero__description">
              Frontend developer yang membuat pengalaman digital terasa hidup.
            </p>
          </div>
          <div class="hero__photo-hanging">
            <div class="hero__photo-connector" aria-hidden="true"></div>
            <div class="hero__photo">
              <img src="assets/ijam.jpg" alt="Foto profil Ilzam Roin Musyafa" />
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
